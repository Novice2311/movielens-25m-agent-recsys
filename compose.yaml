name: ml25m-block2
x-model: &model
  image: ghcr.io/ggml-org/llama.cpp:server
  volumes: ["./models:/models:ro"]
  user: "10001:10001"
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 2g
  cpus: 4
  pids_limit: 128
  networks: [internal]
services:
  app:
    build: .
    ports: ["127.0.0.1:18080:8080"]
    environment:
      LLM_BASE_URL: http://llm-gateway:8081
      STATE_DIR: /state
      ARTIFACT_DIR: /artifacts
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
    volumes:
      - ./artifacts:/artifacts:ro
      - agent_state:/state
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    cpus: 2
    pids_limit: 128
    networks: [internal]
    depends_on:
      state-init: {condition: service_completed_successfully}
      llm-gateway: {condition: service_started}
      otel: {condition: service_started}
  state-init:
    image: python:3.12.10-slim
    user: root
    command: ["python","-c","import os; os.chown('/state',10001,10001)"]
    volumes: ["agent_state:/state"]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
  llm-gateway:
    build: .
    command: ["uvicorn","llm_proxy:app","--host","0.0.0.0","--port","8081"]
    ports: ["127.0.0.1:11435:8081"]
    volumes: ["./models/models.json:/models/models.json:ro"]
    read_only: true
    user: "10001:10001"
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    depends_on: [qwen-small,qwen-modern,gemma-validator]
  qwen-small:
    <<: *model
    command: ["-m","/models/qwen3-0.6b.gguf","--host","0.0.0.0","--port","8080","-c","4096","-t","4","--parallel","1","--chat-template-kwargs","{\"enable_thinking\":false}"]
  qwen-modern:
    <<: *model
    command: ["-m","/models/qwen3.5-0.8b.gguf","--host","0.0.0.0","--port","8080","-c","4096","-t","4","--parallel","1","--chat-template-kwargs","{\"enable_thinking\":false}"]
  gemma-validator:
    <<: *model
    command: ["-m","/models/gemma3-270m.gguf","--host","0.0.0.0","--port","8080","-c","4096","-t","4","--parallel","1"]
  prometheus:
    image: prom/prometheus:v3.2.1
    ports: ["127.0.0.1:18090:9090"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/alerts.yml:/etc/prometheus/alerts.yml:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml","--storage.tsdb.retention.time=7d"]
    networks: [internal]
  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports: ["127.0.0.1:19093:9093"]
    volumes: ["./infra/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    networks: [internal]
  otel:
    image: otel/opentelemetry-collector-contrib:0.123.0
    volumes: ["./infra/otel.yml:/etc/otelcol-contrib/config.yaml:ro"]
    networks: [internal]
  tempo:
    image: grafana/tempo:2.7.2
    ports: ["127.0.0.1:13200:3200"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./infra/tempo.yml:/etc/tempo.yaml:ro"]
    networks: [internal]
  grafana:
    image: grafana/grafana:11.6.0
    ports: ["127.0.0.1:18300:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes: ["./infra/grafana:/etc/grafana/provisioning:ro"]
    networks: [internal]
volumes:
  agent_state:
networks:
  internal:
    internal: true
