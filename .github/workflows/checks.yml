name: Contracts and reproducibility checks
on:
  push:
    paths-ignore: ['report/**', 'README.md']
  pull_request:
    paths-ignore: ['report/**', 'README.md']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements-train.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q
      - run: python -m scripts.train_gate
      - uses: actions/upload-artifact@v4
        with:
          name: decision-evaluation
          path: results/decision_eval.json
